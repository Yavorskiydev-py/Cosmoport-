global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  - job_name: mission-control
    static_configs:
      - targets: ["mission-control:8081"]

  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:9100"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
