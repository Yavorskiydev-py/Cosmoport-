# Полный деплой "Космопорта": 3 Go-сервиса + PostgreSQL + RabbitMQ + мониторинг.
#
#   docker compose up -d --build              — поднять систему
#   docker compose --profile load up -d loadgen — запустить нагрузочный тест
#   docker compose down -v                    — остановить и удалить данные
#
# Внешние порты задаются в файле .env (Docker Compose читает его автоматически).

name: cosmoport

x-go-service: &go-service
  build:
    context: .
  restart: unless-stopped
  labels:
    logging: promtail # по этой метке Promtail собирает логи в Loki
  environment: &common-env
    LOG_LEVEL: info

services:
  # ---------------- инфраструктура ----------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmoport
      POSTGRES_PASSWORD: cosmoport
      POSTGRES_DB: cosmoport
    ports:
      - "${POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmoport -d cosmoport"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: cosmoport
      RABBITMQ_DEFAULT_PASS: cosmoport
    ports:
      - "${RABBITMQ_PORT:-27672}:5672"     # AMQP
      - "${RABBITMQ_UI_PORT:-27673}:15672" # веб-интерфейс управления
    volumes:
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cosmoport.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------- Go-сервисы ----------------
  api:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: api
    environment:
      <<: *common-env
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://cosmoport:cosmoport@postgres:5432/cosmoport?sslmode=disable
      RABBITMQ_URL: amqp://cosmoport:cosmoport@rabbitmq:5672/
      JWT_SECRET: super-secret-cosmic-key-change-me
      JWT_TTL: 24h
      # ссылки, которые веб-интерфейс показывает во вкладке «Мониторинг»
      GRAFANA_PUBLIC_URL: http://localhost:${GRAFANA_PORT:-23000}
      PROMETHEUS_PUBLIC_URL: http://localhost:${PROMETHEUS_PORT:-29090}
      RABBITMQ_PUBLIC_URL: http://localhost:${RABBITMQ_UI_PORT:-27673}
    ports:
      - "${API_PORT:-28080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 20s

  mission-control:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: mission-control
    environment:
      <<: *common-env
      HTTP_ADDR: ":8081"
      RABBITMQ_URL: amqp://cosmoport:cosmoport@rabbitmq:5672/
      WORKERS: "1000" # горутины почти всё время спят (имитация этапов), поэтому их может быть много
      MIN_STAGE_DELAY: 1s
      MAX_STAGE_DELAY: 3s
      REJECT_RATE: "0.1"
    ports:
      - "${MISSION_CONTROL_PORT:-28081}:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 10s

  loadgen:
    <<: *go-service
    profiles: ["load"] # запускается только явно: docker compose --profile load up -d loadgen
    restart: "no"
    build:
      context: .
      args:
        SERVICE: loadgen
    environment:
      <<: *common-env
      TARGET_URL: http://api:8080
      USERS: "${LOAD_USERS:-40}"
      DURATION: "${LOAD_DURATION:-5m}"
      RAMP_UP: "${LOAD_RAMP_UP:-30s}"
      THINK_MIN: 100ms
      THINK_MAX: 500ms
      METRICS_ADDR: ":9100"
    ports:
      - "${LOADGEN_PORT:-29100}:9100"
    depends_on:
      api:
        condition: service_healthy

  # ---------------- мониторинг ----------------
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-29090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgres://cosmoport:cosmoport@postgres:5432/cosmoport?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-23100}:3100"

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./deploy/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true" # графики встраиваются в веб-интерфейс api
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cosmoport.json
    ports:
      - "${GRAFANA_PORT:-23000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
